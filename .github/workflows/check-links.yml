name: Check game links

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate relative Markdown links
        run: python scripts/check_links.py
      - name: Count playable routes
        run: python scripts/count_routes.py
